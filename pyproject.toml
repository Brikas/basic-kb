[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-kb"
dynamic = ["version"]
description = "A small, config-driven semantic search engine over markdown/text sources (local embeddings + sqlite-vec)."
readme = "README.md"
# No 3.14: pinned deps (py-rust-stemmers) have no 3.14 wheel and fall back to Rust source builds.
requires-python = ">=3.10,<3.14"
dependencies = [
    "sqlite-vec>=0.1.9",  # exact vector search inside SQLite; see docs/adr/0001
    "pyyaml>=6.0",
    "requests>=2.31",   # cloud embedders/rerankers and the attach client
    "watchdog>=4.0",    # cross-platform file events for `basic-kb watch`
    "filelock>=3.12",   # cross-platform writer lock on the store (one writer per store)
]

[project.optional-dependencies]
# On-device embedding and reranking. Optional because an instance that embeds through an
# API needs none of it, and fastembed pulls onnxruntime with it (~60 MB of native wheels).
# Both imports are lazy, so a missing install only surfaces if a config selects a local model.
local = [
    "fastembed>=0.8.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",      # FastAPI's TestClient
    "basic-kb[serve,local]",
]

[project.scripts]
basic-kb = "basic_kb.cli:main"

[tool.setuptools]
packages = ["basic_kb"]

[tool.setuptools.dynamic]
version = {attr = "basic_kb.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not model and not network'"
markers = [
    "model: loads a real embedding/reranker model (downloads on first run); opt in with -m model",
    "network: talks to a real network service; opt in with -m network",
]
