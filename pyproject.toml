[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-kb"
version = "0.1.0"
description = "A small, config-driven semantic search engine over markdown/text sources (local embeddings + ChromaDB)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.8.0",
    "pyyaml>=6.0",
    "requests>=2.31",   # used by the optional Jina reranker
]

[project.scripts]
basic-kb = "basic_kb.cli:main"

[tool.setuptools]
packages = ["basic_kb"]
